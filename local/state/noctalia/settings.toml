[plugins]
enabled = [ "nightwatch75/file-search" ]

[shell]
app_icon_color = "primary"
font_family = "JetBrains Mono"

    [shell.launcher]
    auto_paste = "off"
    categories = false

        [shell.launcher.providers.windows]
        prefix = ""

    [shell.panel]
    launcher_placement = "attached"

[theme]
builtin = "Noctalia"
community_palette = "Catppuccin Frappe Lavender"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "niri", "qt" ]
    community_ids = [ "telegram", "vscode", "lazygit" ]

[wallpaper]
directory = "~/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/rasmus/Pictures/Wallpapers/ASCII-neptune.png"

    [wallpaper.last]
    path = "/home/rasmus/Pictures/Wallpapers/ASCII-neptune.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/rasmus/Pictures/Wallpapers/ASCII-neptune.png"

[widget.launcher]
glyph = "navigation-filled"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false