keymap:
  - name: Helium Browser Remaps
    application:
      only: [helium]
    remap:
      C-j: C-PageUp
      C-semicolon: C-PageDown
      C-A-j: A-Left
      C-A-semicolon: A-Right

  - name: Movement Remaps
    application:
      only: [org.gnome.Papers, com.belmoussaoui.Authenticator]
    remap:
      C-j: Left
      C-k: Down
      C-l: Up
      C-semicolon: Right

  - name: SpeedCrunch Remaps
    application:
      only: [org.speedcrunch.SpeedCrunch]
    remap:
      C-q: C-w
      C-j: C-PageUp
      C-semicolon: C-PageDown
      C-u: [C-a, BackSpace]
      C-slash: Shift-Down 
      C-minus: Shift-Up
