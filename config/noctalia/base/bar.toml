[bar.default]
background_opacity = 0.9
center = [ "media" ]
end = [ "clipboard", "network", "bluetooth", "battery", "clock" ]
show_on_workspace_switch = false
start = [ "launcher", "workspaces" ]
margin_ends = 100 
thickness = 32

[widget.launcher]
glyph = "navigation-filled"
scale = 1.10

[widget.media]
hide_when_no_media = true
hide_album_art = true
max_length = 240
title_scroll = "on_hover"

[widget.media.actions]
scroll_down = "volume-up"
scroll_left = "media previous"
scroll_right = "media next"
scroll_up = "volume-down"

[widget.clipboard]
scale = 1.05

[widget.bluetooth]
scale = 1.10

[widget.network]
scale = 1.15
show_label = false
vpn_status = "hidden"

# Fix size and placement
[widget.battery]
capsule = true
capsule_opacity = 0.0
capsule_padding = 0
scale = 1.3
show_label = false
