# Shared lockscreen settings. Per-output widgets and widget_order live in hosts/*.toml

[lockscreen]
transition = [ "diamond", "disc", "fade", "honeycomb", "melt", "pixel", "stripes", "wipe", "zoom" ]

[lockscreen_widgets]
enabled = true
schema_version = 2

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true
