[theme]
builtin = "Noctalia"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[theme.templates]
builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "niri", "qt" ]
community_ids = [ "telegram", "vscode", "lazygit" ]

[backdrop]
enabled        = true 
blur_intensity = 0.5    # 0.0 = no blur, 1.0 = maximum blur
tint_intensity = 0.3    # 0.0 = no tint, 1.0 = fully opaque tint

